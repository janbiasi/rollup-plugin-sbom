packages:
  - test/fixtures/*

auditLevel: moderate
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4 # deepmerge <=4.3.1, no patched version; dev-only via @rollup/plugin-node-resolve (regression-251 fixture)
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  - "@cyclonedx/cyclonedx-library"
  - "@rolldown/*"
  - normalize-package-data
  - rolldown
  - vite
  - fast-xml-parser@5.10.1
  - spdx-expression-parse@5.0.0
  - tsdown@0.22.9

overrides:
  # security: transitive dev-only deps with patched versions not yet picked up upstream
  "handlebars@<4.7.10": ^4.7.10 # via semantic-release
  "undici@>=7.0.0 <7.30.1": ^7.30.1 # GHSA-55wc-3pg8-jfw6 via @semantic-release/github, nuxt
  "undici@>=6.0.0 <6.29.1": ^6.29.1 # via @actions/http-client (semantic-release)
  "fast-uri@<3.1.9": ^3.1.9 # via ajv
  "vite@>=8.3.0 <8.3.3": ^8.3.5 # via vite-node (nuxt-v4 fixture)
  "node-forge@<=1.4.0": ^1.4.2 # GHSA-86w9-cpqp-85rv via listhen (nuxt-v4 fixture)
  "serialize-javascript@<7.1.3": ^7.1.3 # GHSA-m5mm-p8h7-m29v via @rollup/plugin-terser (nuxt-v4 fixture)

allowBuilds:
  "@parcel/watcher": false
  esbuild: true

catalog:
  typescript: 6.0.3

catalogs:
  testing:
    "@base-ui/react": ^1.5.0
    "@types/luxon": 3.7.6
    "@types/react": ^19.2.15
    "@types/react-dom": ^19.2.3
    "@vitejs/plugin-react": ^6.1.2
    date-fns: 4.4.0
    luxon: 3.7.2
    react-dom: 19.3.1
    react-remove-scroll: 2.7.2
    react: 19.3.1
  rollup4:
    "@rollup/plugin-commonjs": 29.0.3
    "@rollup/plugin-json": 6.1.0
    "@rollup/plugin-node-resolve": 16.0.3
    rollup: 4.65.1
  rolldown1:
    rolldown: 1.2.15
  vite6:
    "@vitejs/plugin-react": ^4.7.0
    vite: ^6.4.4
  vite7:
    "@vitejs/plugin-react": ^5.2.0
    vite: ^7.3.7
  vite8:
    "@vitejs/plugin-react": ^6.0.3
    vite: ^8.3.5
