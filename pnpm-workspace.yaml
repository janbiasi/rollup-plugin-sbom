packages:
  - test/fixtures/*

auditLevel: moderate
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm # braces <=3.0.3, no patched version; dev-only via micromatch (semantic-release, nuxt-v4 fixture)
    - GHSA-86w9-cpqp-85rv # node-forge <=1.4.0, no patched version; dev-only via listhen (nuxt-v4 fixture)
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
blockExoticSubdeps: true
minimumReleaseAgeExclude:
  - "@cyclonedx/cyclonedx-library"
  - "@rolldown/*"
  - normalize-package-data
  - rolldown
  - vite
  - fast-xml-parser@5.10.1
  - spdx-expression-parse@5.0.0
  - tsdown@0.22.9

allowBuilds:
  "@parcel/watcher": false
  esbuild: true

catalog:
  typescript: 6.0.3

catalogs:
  testing:
    "@base-ui/react": ^1.5.0
    "@types/luxon": 3.7.6
    "@types/react": ^19.2.15
    "@types/react-dom": ^19.2.3
    "@vitejs/plugin-react": 6.1.1
    date-fns: 4.4.0
    luxon: 3.7.2
    react-dom: 19.3.0
    react-remove-scroll: 2.7.2
    react: 19.3.0
  rollup4:
    "@rollup/plugin-commonjs": 29.0.3
    "@rollup/plugin-json": 6.1.0
    "@rollup/plugin-node-resolve": 16.0.3
    rollup: 4.63.5
  rolldown1:
    rolldown: 1.2.12
  vite6:
    "@vitejs/plugin-react": ^4.7.0
    vite: ^6.4.2
  vite7:
    "@vitejs/plugin-react": ^5.2.0
    vite: ^7.3.3
  vite8:
    "@vitejs/plugin-react": ^6.0.3
    vite: ^8.1.5
